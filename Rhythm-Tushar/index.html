<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Save the Date</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Playfair+Display:wght@500;600;700&family=Alex+Brush&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#fbf1e8;
    --blush:#f6ddd2;
    --ink:#20402f;
    --ink-soft:#3c5c48;
    --gold:#b48a4a;
    --gold-soft:#d8b787;
    --paper:#fffaf4;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;background:#0c0c0c;}
  body{
    display:flex;align-items:center;justify-content:center;
    font-family:'Cormorant Garamond', serif;
    min-height:100vh;
  }
  .stage{
    position:relative;
    width:min(94vw, 430px);
    aspect-ratio:9/16;
    max-height:96vh;
    overflow:hidden;
    border-radius:18px;
    box-shadow:0 30px 70px rgba(0,0,0,.55);
    background:
      radial-gradient(120% 70% at 15% 8%, #f9e2d6 0%, transparent 55%),
      radial-gradient(120% 80% at 90% 95%, #f1d9cf 0%, transparent 55%),
      linear-gradient(180deg, var(--cream) 0%, var(--blush) 100%);
  }
  .stage::before{
    content:"";position:absolute;inset:0;pointer-events:none;
    background-image:
      repeating-linear-gradient(0deg, rgba(150,110,60,.10) 0px, rgba(150,110,60,.10) 1px, transparent 1px, transparent 26px),
      repeating-linear-gradient(90deg, rgba(150,110,60,.10) 0px, rgba(150,110,60,.10) 1px, transparent 1px, transparent 26px);
    opacity:.55;
  }
  .stage::after{
    content:"";position:absolute;inset:0;pointer-events:none;
    background-image: radial-gradient(circle, rgba(180,138,74,.14) 1px, transparent 1.4px);
    background-size:13px 13px;
    opacity:.4;
  }
  .frame{ position:absolute;inset:14px; border:1px solid var(--gold-soft); border-radius:10px; pointer-events:none; z-index:5; }
  svg.defs{position:absolute;width:0;height:0;}

  /* ---------- ambient doodles ---------- */
  .doodles{ position:absolute; inset:0; z-index:1; pointer-events:none; color:#b17b52; }
  .doodles svg{ position:absolute; overflow:visible; opacity:.4; animation: doodleDrift 7s ease-in-out infinite; }
  @keyframes doodleDrift{
    0%,100%{ transform:translateY(0) rotate(var(--r,0deg)); }
    50%{ transform:translateY(-6px) rotate(calc(var(--r,0deg) + 3deg)); }
  }

  /* ---------- scenes ---------- */
  .scene{
    position:absolute;inset:0;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    opacity:0; visibility:hidden;
    transition: opacity .6s ease;
    padding:30px 24px;
    text-align:center;
    z-index:3;
  }
  .scene.active{ opacity:1; visibility:visible; }

  /* ---------- puzzle pieces ---------- */
  .piece{ filter:drop-shadow(0 16px 24px rgba(60,40,20,.30)); }
  .piece svg{ display:block; width:100%; height:auto; overflow:visible; }
  .fit-row{ display:flex; align-items:center; justify-content:center; filter:drop-shadow(0 16px 26px rgba(60,40,20,.32)); }
  .fit-row .piece{ filter:none; }

  #s1 .piece{ animation: dropIn 1s .05s both; }
  #s2 .piece{ animation: dropIn 1s .05s both; }
  @keyframes dropIn{ from{transform:translateY(-26px) rotate(-4deg) scale(.94); opacity:0;} to{transform:none; opacity:1;} }
  #s3 .pc-left{ animation: slideRight 1.05s .1s cubic-bezier(.22,.9,.25,1) both; }
  #s3 .pc-right{ animation: slideLeft 1.05s .1s cubic-bezier(.22,.9,.25,1) both; }
  @keyframes slideRight{ from{transform:translateX(-46px) rotate(-4deg); opacity:0;} to{transform:none; opacity:1;} }
  @keyframes slideLeft{ from{transform:translateX(46px) rotate(4deg); opacity:0;} to{transform:none; opacity:1;} }

  /* ---------- type ---------- */
  .eyebrow{
    font-family:'Playfair Display', serif;
    letter-spacing:.28em; text-transform:uppercase;
    font-size:12.5px; color:var(--ink); font-weight:600;
    margin-bottom:16px; min-height:16px;
  }
  .location{ margin-top:14px; font-family:'Alex Brush', cursive; font-size:25px; color:var(--ink-soft); min-height:30px; }
  .personname{ margin-top:2px; font-family:'Playfair Display', serif; font-weight:600; font-size:23px; color:var(--ink); letter-spacing:.02em; min-height:30px; }
  .tag{
    margin-top:11px; display:inline-block;
    font-style:italic; font-size:15px; letter-spacing:.03em;
    color:var(--gold); padding:5px 16px; border:1px solid var(--gold-soft); border-radius:999px;
    background:rgba(255,250,244,.55);
    animation: popIn .6s .95s both;
  }
  @keyframes popIn{ from{transform:scale(.86); opacity:0;} to{transform:scale(1); opacity:1;} }

  .fit-title{
    font-family:'Playfair Display', serif; font-size:26px; letter-spacing:.05em; font-weight:600;
    margin-bottom:16px; min-height:32px; color:var(--ink);
  }
  .chip-row{ display:flex; align-items:center; gap:12px; margin-top:16px; }
  .chip{
    font-style:italic; font-size:13.5px; color:var(--gold);
    padding:5px 13px; border:1px solid var(--gold-soft); border-radius:999px; background:rgba(255,250,244,.6);
    white-space:nowrap;
  }
  .chip-left{ animation: chipInLeft .7s .55s both; }
  .chip-right{ animation: chipInRight .7s .55s both; }
  @keyframes chipInLeft{ from{transform:translateX(-30px); opacity:0;} to{transform:none; opacity:1;} }
  @keyframes chipInRight{ from{transform:translateX(30px); opacity:0;} to{transform:none; opacity:1;} }
  .heart{ color:#b45a4a; font-size:20px; animation: heartBeat 1.6s ease-in-out infinite; }
  @keyframes heartBeat{ 0%,100%{transform:scale(1);} 25%{transform:scale(1.18);} 40%{transform:scale(.98);} }

  .meet-line{ margin-top:18px; max-width:255px; font-style:italic; font-size:16.5px; line-height:1.5; color:var(--ink-soft); min-height:50px; }

  .names{ font-family:'Playfair Display', serif; font-size:36px; color:var(--ink); font-weight:600; line-height:1.15; min-height:44px; }
  .names > span{ display:inline-block; }
  .amp{ color:var(--gold); font-family:'Alex Brush', cursive; font-size:32px; font-weight:400; margin:0 8px; vertical-align:baseline; }
  .subline{ margin-top:8px; font-size:16px; letter-spacing:.14em; color:var(--ink-soft); text-transform:uppercase; min-height:22px; }
  .divider{ width:0; height:1px; background:var(--gold-soft); margin:18px 0; animation: ruleGrow .8s 1.1s ease both; }
  @keyframes ruleGrow{ to{ width:74px; } }
  .date{ font-family:'Playfair Display', serif; font-size:25px; letter-spacing:.08em; font-weight:600; min-height:32px; color:var(--gold); }
  .venue{ margin-top:12px; font-size:19px; color:var(--ink); line-height:1.45; min-height:56px; }
  .venue .v-lead{ margin-right:.34em; }
  .venue .v-name{ font-weight:600; }
  .venue .v-city{ display:block; }

  /* ---------- text animation engine ---------- */
  .tx{ display:inline-block; white-space:pre; opacity:0; will-change:transform,opacity,filter; }
  .mask{ display:inline-block; overflow:hidden; vertical-align:bottom; padding-bottom:.14em; margin-bottom:-.14em; }
  .mask .tx{ opacity:1; }

  .fx-up{ animation: fxUp .5s cubic-bezier(.2,.8,.25,1) both; }
  @keyframes fxUp{ from{opacity:0; transform:translateY(13px);} to{opacity:1; transform:none;} }

  .fx-blur{ animation: fxBlur .62s ease both; }
  @keyframes fxBlur{ from{opacity:0; filter:blur(9px); transform:scale(1.09);} to{opacity:1; filter:blur(0); transform:none;} }

  .fx-flip{ animation: fxFlip .58s cubic-bezier(.2,.85,.25,1) both; transform-origin:50% 100%; }
  @keyframes fxFlip{ from{opacity:0; transform:rotateX(-94deg) translateY(8px);} to{opacity:1; transform:none;} }

  .fx-wave{ animation: fxWave .72s cubic-bezier(.18,.9,.3,1.25) both; }
  @keyframes fxWave{ 0%{opacity:0; transform:translateY(-18px) scale(.88);} 62%{opacity:1; transform:translateY(4px) scale(1.03);} 100%{opacity:1; transform:none;} }

  .fx-pop{ animation: fxPop .5s cubic-bezier(.2,1.4,.4,1) both; }
  @keyframes fxPop{ from{opacity:0; transform:scale(.4);} to{opacity:1; transform:scale(1);} }

  .fx-swing{ animation: fxSwing .6s cubic-bezier(.2,.9,.25,1) both; transform-origin:50% 0%; }
  @keyframes fxSwing{ from{opacity:0; transform:rotate(14deg) translateY(-12px);} to{opacity:1; transform:none;} }

  .fx-left{ animation: fxLeft .58s cubic-bezier(.2,.8,.25,1) both; }
  @keyframes fxLeft{ from{opacity:0; transform:translateX(-20px);} to{opacity:1; transform:none;} }
  .fx-right{ animation: fxRight .58s cubic-bezier(.2,.8,.25,1) both; }
  @keyframes fxRight{ from{opacity:0; transform:translateX(20px);} to{opacity:1; transform:none;} }

  .fx-rise{ animation: fxRise .66s cubic-bezier(.2,.85,.2,1) both; }
  @keyframes fxRise{ from{transform:translateY(105%);} to{transform:translateY(0);} }

  .fx-track{ animation: fxTrack .95s cubic-bezier(.2,.8,.25,1) both; }
  @keyframes fxTrack{ from{opacity:0; letter-spacing:.55em; filter:blur(4px);} to{opacity:1; filter:blur(0);} }

  .fx-wipe{ animation: fxWipe .95s cubic-bezier(.5,0,.2,1) both; }
  @keyframes fxWipe{ from{opacity:0; clip-path:inset(0 100% 0 0);} to{opacity:1; clip-path:inset(0 0 0 0);} }

  /* trait words keep drifting once they've landed */
  .tx.floating{ opacity:1; animation: wordFloat 3.6s ease-in-out infinite; }
  @keyframes wordFloat{
    0%,100%{ transform:translateY(0) rotate(0deg); }
    30%{ transform:translateY(-4px) rotate(-2deg); }
    65%{ transform:translateY(3px) rotate(2deg); }
  }

  /* gold sweep — switched on only once the letters have finished landing */
  .gleam.lit{
    background:linear-gradient(90deg, currentColor 0%, currentColor 38%, var(--gold-soft) 50%, currentColor 62%, currentColor 100%);
    background-size:260% 100%;
    -webkit-background-clip:text; background-clip:text;
    -webkit-text-fill-color:transparent;
    animation: gleam 3.4s linear infinite;
  }
  @keyframes gleam{ 0%{background-position:130% 0;} 100%{background-position:-30% 0;} }

  @media (prefers-reduced-motion: reduce){
    *{ animation:none !important; transition:none !important; }
    .tx{ opacity:1 !important; }
    .divider{ width:74px; }
    .scene{ opacity:0; visibility:hidden; }
    #s4{ opacity:1; visibility:visible; }
  }
</style>
</head>
<body>

<!-- doodle symbols -->
<svg class="defs">
  <defs>
    <symbol id="d-heart" viewBox="0 0 60 54"><path d="M30,50 C6,34 2,18 12,9 C20,2 29,7 30,16 C31,7 40,2 48,9 C58,18 54,34 30,50 Z" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="d-butterfly" viewBox="0 0 70 60"><path d="M35,10 C35,10 24,-2 12,6 C2,13 8,28 22,26 C30,25 35,18 35,18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><path d="M35,10 C35,10 46,-2 58,6 C68,13 62,28 48,26 C40,25 35,18 35,18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><path d="M35,18 C35,18 25,32 14,32 C4,32 2,44 12,46 C22,48 30,38 35,30" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><path d="M35,18 C35,18 45,32 56,32 C66,32 68,44 58,46 C48,48 40,38 35,30" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><line x1="35" y1="8" x2="35" y2="34" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
    <symbol id="d-leaf" viewBox="0 0 40 60"><path d="M20,58 C20,58 4,42 6,22 C8,4 20,2 20,2 C20,2 32,4 34,22 C36,42 20,58 20,58 Z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/><path d="M20,4 L20,54" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
    <symbol id="d-lips" viewBox="0 0 60 30"><path d="M4,14 C14,4 22,10 30,10 C38,10 46,4 56,14 C46,12 40,20 30,20 C20,20 14,12 4,14 Z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/><path d="M10,14 C18,17 42,17 50,14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
  </defs>
</svg>

<div class="stage">
  <div class="doodles">
    <svg style="top:6%;left:8%;width:30px;--r:-8deg;animation-delay:.1s;"><use href="#d-heart"/></svg>
    <svg style="top:3%;right:10%;width:34px;--r:10deg;animation-delay:.6s;"><use href="#d-leaf"/></svg>
    <svg style="top:14%;right:4%;width:26px;--r:6deg;animation-delay:1.1s;"><use href="#d-butterfly"/></svg>
    <svg style="top:22%;left:3%;width:24px;--r:-4deg;animation-delay:.3s;"><use href="#d-lips"/></svg>
    <svg style="bottom:26%;left:6%;width:30px;--r:12deg;animation-delay:.9s;"><use href="#d-butterfly"/></svg>
    <svg style="bottom:20%;right:6%;width:26px;--r:-10deg;animation-delay:1.4s;"><use href="#d-heart"/></svg>
    <svg style="bottom:10%;left:12%;width:22px;--r:4deg;animation-delay:.2s;"><use href="#d-leaf"/></svg>
    <svg style="bottom:6%;right:14%;width:28px;--r:-6deg;animation-delay:.7s;"><use href="#d-lips"/></svg>
    <svg style="top:44%;left:4%;width:20px;--r:8deg;animation-delay:1.2s;"><use href="#d-heart"/></svg>
    <svg style="top:48%;right:3%;width:22px;--r:-12deg;animation-delay:.5s;"><use href="#d-leaf"/></svg>
    <svg style="top:8%;left:42%;width:20px;--r:0deg;animation-delay:1.6s;"><use href="#d-heart"/></svg>
    <svg style="bottom:4%;left:44%;width:24px;--r:5deg;animation-delay:.8s;"><use href="#d-butterfly"/></svg>
  </div>

  <div class="frame"></div>

  <!-- Scene 1 : first piece -->
  <div class="scene" id="s1">
    <div class="eyebrow"  data-k="one.eyebrow"  data-anim="chars:track:0"></div>
    <div class="piece"    data-piece="one"></div>
    <div class="location" data-k="one.location" data-anim="chars:wave:26"></div>
    <div class="personname gleam" data-k="one.name" data-anim="chars:flip:52:600"></div>
    <div class="tag flowy" data-k="one.trait" data-anim="words:left:170:900"></div>
  </div>

  <!-- Scene 2 : second piece -->
  <div class="scene" id="s2">
    <div class="eyebrow"  data-k="two.eyebrow"  data-anim="chars:track:0"></div>
    <div class="piece"    data-piece="two"></div>
    <div class="location" data-k="two.location" data-anim="chars:wave:26:0:rev"></div>
    <div class="personname gleam" data-k="two.name" data-anim="chars:flip:52:600:rev"></div>
    <div class="tag flowy" data-k="two.trait" data-anim="words:left:170:900"></div>
  </div>

  <!-- Scene 3 : they interlock -->
  <div class="scene" id="s3">
    <div class="fit-title gleam" data-k="fit.title" data-anim="chars:pop:46"></div>
    <div class="fit-row">
      <div class="piece pc-left"  data-piece="one" data-combo="left"></div>
      <div class="piece pc-right" data-piece="two" data-combo="right"></div>
    </div>
    <div class="chip-row">
      <div class="chip chip-left flowy"  data-k="one.trait" data-anim="words:left:170:750"></div>
      <div class="heart">&#10084;</div>
      <div class="chip chip-right flowy" data-k="two.trait" data-anim="words:left:170:750"></div>
    </div>
    <div class="meet-line" data-k="fit.line" data-anim="words:blur:70:900"></div>
  </div>

  <!-- Scene 4 : save the date -->
  <div class="scene" id="s4">
    <div class="eyebrow" data-k="final.eyebrow" data-anim="chars:track:0"></div>
    <div class="names">
      <span class="n1 gleam" data-k="one.name"        data-anim="chars:swing:44:250"></span>
      <span class="amp"      data-k="final.connector" data-anim="chars:pop:0:640"></span>
      <span class="n2 gleam" data-k="two.name"        data-anim="chars:swing:44:820"></span>
    </div>
    <div class="subline" data-k="final.subline" data-anim="chars:blur:34:1350"></div>
    <div class="divider"></div>
    <div class="date gleam" data-k="final.date" data-anim="chars:up:40:1750"></div>
    <div class="venue">
      <span class="v-lead" data-k="final.venueLead" data-anim="chars:up:26:2250"></span>
      <b class="v-name"    data-k="final.venueName" data-anim="words:rise:120:2380"></b>
      <span class="v-city" data-k="final.venueCity" data-anim="chars:blur:32:2750"></span>
    </div>
  </div>

</div>

<script>
/* ==========================================================================
   1. EDIT EVERYTHING HERE  —  next couple, new card. Nothing else to touch.
   ========================================================================== */
var CONFIG = {

  one: {                                   /* left piece  */
    eyebrow : 'Missing Piece \u2014 One',
    name    : 'Rhythm',
    photo   : 'images/rhythm.png',
    location: 'Somewhere in Bengaluru',
    trait   : 'goofy & bubbly',
    /* PHOTO FRAMING
       The photo covers the piece's real outline (body + whatever tabs stick out),
       nothing more — so at zoom 1 you already see the widest safe crop.
       focusX 0=left  50=centre 100=right   |   focusY 0=top 50=centre 100=bottom
       zoom   1 = widest safe fit, 1.2 = tighter/closer.
              Below 1 pulls back further still, but the very tips of the tabs
              may show the cream paper backing — 0.9 is usually still clean.
       shiftX/shiftY = nudge in px                                            */
    focusX  : 50,
    focusY  : 22,
    zoom    : 1,
    shiftX  : 0,
    shiftY  : 0
  },

  two: {                                   /* right piece */
    eyebrow : 'Missing Piece \u2014 Two',
    name    : 'Tushar',
    photo   : 'images/tushar.jpg',
    location: 'Somewhere in Gurgaon',
    trait   : 'shy & sweet',
    focusX  : 50,
    focusY  : 25,
    zoom    : 1,
    shiftX  : 0,
    shiftY  : 0
  },

  fit: {
    title : 'One Perfect Fit',
    line  : 'Her bubbly chaos met his quiet sweetness \u2014 and somehow, it just fit.'
  },

  final: {
    eyebrow  : 'Save the Date',
    connector: '&',                        /* between the two names          */
    subline  : 'are getting married',
    date     : '16 \u2013 17 \u00B7 12 \u00B7 2026',
    venueName: 'Jollywood Resort',
    venueCity: 'Pushkar',
    venueLead: 'at'
  },

  /* how long each scene stays on screen, milliseconds */
  timing: { hold: 5200, gap: 260 }
};

/* ==========================================================================
   2. Engine — puzzle geometry, text reveals, scene loop.
   ========================================================================== */
(function(){
  'use strict';

  var SVGNS  = 'http://www.w3.org/2000/svg';
  var XLINK  = 'http://www.w3.org/1999/xlink';

  /* ---- puzzle geometry ------------------------------------------------- */
  var BODY_W = 200, BODY_H = 250;                 /* card body, px            */
  var S      = 48;                                /* knob scale, px           */
  var KNOB_OUT = 1.22 * S;                        /* how far a tab reaches out*/
  var PAD    = Math.round(KNOB_OUT) + 9;          /* bleed so knobs never clip*/
  var VB_W   = BODY_W + PAD * 2, VB_H = BODY_H + PAD * 2;

  /* one real jigsaw knob, sized in px and centred on the edge:
     [along the edge, out from the edge] — narrow neck, round head          */
  var KNOB = [
    [-0.30, 0.00], [-0.22,-0.16], [-0.22, 0.16],
    [-0.22, 0.48], [-0.58, 0.44], [-0.58, 0.78],
    [-0.58, 1.10], [-0.26, 1.22], [ 0.00, 1.22],
    [ 0.26, 1.22], [ 0.58, 1.10], [ 0.58, 0.78],
    [ 0.58, 0.44], [ 0.22, 0.48], [ 0.22, 0.16],
    [ 0.22,-0.16], [ 0.30, 0.00], [ 0.62, 0.00]
  ];
  var KNOB_START = -0.62;

  /* +1 = tab sticking out, -1 = socket pressed in, 0 = flat (clean square edge) */
  var SHAPE = {
    one: { t: 1, r:-1, b: 1, l: 0 },   /* left  piece: socket right, flat left  */
    two: { t: 1, r: 0, b: 1, l: 1 }    /* right piece: tab left, flat right     */
  };

  function edge(ax, ay, bx, by, dir){
    if(!dir) return 'L' + bx + ',' + by;
    var dx = bx - ax, dy = by - ay;
    var len = Math.sqrt(dx*dx + dy*dy);
    var ux = dx/len, uy = dy/len;         /* along  */
    var nx = dy/len, ny = -dx/len;        /* outward normal (clockwise path) */
    var mx = ax + dx/2, my = ay + dy/2;   /* knob sits at the edge midpoint  */
    function P(p){
      var x = mx + ux*S*p[0] + nx*S*p[1]*dir;
      var y = my + uy*S*p[0] + ny*S*p[1]*dir;
      return x.toFixed(2) + ',' + y.toFixed(2);
    }
    var s = 'L' + (mx + ux*S*KNOB_START).toFixed(2) + ',' + (my + uy*S*KNOB_START).toFixed(2);
    for(var i = 0; i < KNOB.length; i += 3){
      s += 'C' + P(KNOB[i]) + ' ' + P(KNOB[i+1]) + ' ' + P(KNOB[i+2]);
    }
    return s + 'L' + bx + ',' + by;
  }

  function piecePath(e){
    return 'M0,0'
      + edge(0,0, BODY_W,0, e.t)
      + edge(BODY_W,0, BODY_W,BODY_H, e.r)
      + edge(BODY_W,BODY_H, 0,BODY_H, e.b)
      + edge(0,BODY_H, 0,0, e.l)
      + 'Z';
  }

  var uid = 0;
  function node(name, attrs){
    var n = document.createElementNS(SVGNS, name);
    for(var k in attrs){ if(attrs.hasOwnProperty(k)) n.setAttribute(k, attrs[k]); }
    return n;
  }

  function buildPiece(person, shapeKey){
    var e   = SHAPE[shapeKey];
    var d   = piecePath(e);
    var cid = 'pz' + (++uid);

    var svg = node('svg', {
      viewBox: (-PAD) + ' ' + (-PAD) + ' ' + VB_W + ' ' + VB_H,
      preserveAspectRatio: 'xMidYMid meet'
    });

    var clip = node('clipPath', { id: cid });
    clip.appendChild(node('path', { d: d }));
    var defs = node('defs'); defs.appendChild(clip);
    svg.appendChild(defs);

    /* paper backing so a missing photo still reads as a piece */
    svg.appendChild(node('path', { d: d, fill: 'var(--paper)' }));

    /* ---- how much area actually has to hold photo -----------------------
       Only a TAB (dir === 1) pokes out past the body; a socket eats inwards
       and a flat edge needs nothing. So the photo covers the body plus the
       tab overhangs — NOT the whole padded viewBox. That padding is only
       there to stop the knobs being clipped, and covering it was silently
       zooming every photo in by ~35%.                                      */
    var extL = e.l === 1 ? KNOB_OUT : 0,
        extR = e.r === 1 ? KNOB_OUT : 0,
        extT = e.t === 1 ? KNOB_OUT : 0,
        extB = e.b === 1 ? KNOB_OUT : 0;
    var COV_W = BODY_W + extL + extR;
    var COV_H = BODY_H + extT + extB;

    /* focusX/focusY decide which part survives the crop, like object-position */
    function align(v, lo, mid, hi){ return v <= 33 ? lo : (v <= 66 ? mid : hi); }
    var fx = person.focusX === undefined ? 50 : person.focusX;
    var fy = person.focusY === undefined ? 50 : person.focusY;
    var par = 'x' + align(fx, 'Min', 'Mid', 'Max') + 'Y' + align(fy, 'Min', 'Mid', 'Max') + ' slice';

    var zoom = person.zoom || 1;
    var iw = COV_W * zoom, ih = COV_H * zoom;
    var img = node('image', {
      x: (-extL - (iw - COV_W) * (fx / 100) + (person.shiftX || 0)),
      y: (-extT - (ih - COV_H) * (fy / 100) + (person.shiftY || 0)),
      width: iw, height: ih,
      preserveAspectRatio: par,
      'clip-path': 'url(#' + cid + ')'
    });
    img.setAttribute('href', person.photo);
    img.setAttributeNS(XLINK, 'xlink:href', person.photo);
    svg.appendChild(img);

    /* once we know the photo's real dimensions we can place the cover crop
       exactly, so focusX/focusY become continuous rather than 3-step */
    var probe = new Image();
    probe.onload = function(){
      var nw = probe.naturalWidth, nh = probe.naturalHeight;
      if(!nw || !nh) return;
      var sc = Math.max(COV_W / nw, COV_H / nh) * zoom;
      var w = nw * sc, h = nh * sc;
      img.setAttribute('preserveAspectRatio', 'none');   /* aspect kept by maths */
      img.setAttribute('width',  w);
      img.setAttribute('height', h);
      img.setAttribute('x', -extL - (w - COV_W) * (fx / 100) + (person.shiftX || 0));
      img.setAttribute('y', -extT - (h - COV_H) * (fy / 100) + (person.shiftY || 0));
    };
    probe.src = person.photo;

    /* white rim + hairline, exactly like a cut cardboard piece */
    svg.appendChild(node('path', { d:d, fill:'none', stroke:'var(--paper)', 'stroke-width':7, 'stroke-linejoin':'round' }));
    svg.appendChild(node('path', { d:d, fill:'none', stroke:'rgba(150,110,60,.28)', 'stroke-width':1, 'stroke-linejoin':'round' }));

    return svg;
  }

  /* ---- text reveal engine ---------------------------------------------- */
  /* data-anim = "mode:effect:stagger[:delay][:rev]"
     mode    chars | words | block
     effect  up blur flip wave pop swing left right rise track wipe        */
  function reveal(el){
    var spec = (el.getAttribute('data-anim') || 'chars:up:30').split(':');
    var mode = spec[0], fx = spec[1];
    var step = parseInt(spec[2], 10) || 0;
    var base = parseInt(spec[3], 10) || 0;
    var rev  = spec[4] === 'rev';

    if(el.dataset.orig === undefined) el.dataset.orig = el.innerHTML;
    var html = el.dataset.orig;

    el.classList.remove('lit');
    if(el._lit)  clearTimeout(el._lit);
    if(el._flow) clearTimeout(el._flow);

    if(mode === 'block'){
      el.className = el.className.replace(/\s*fx-\w+/g, '') + ' fx-' + fx;
      el.style.animationDelay = base + 'ms';
      return;
    }

    var tmp = document.createElement('div');
    tmp.innerHTML = html;
    var text = tmp.textContent;
    var units = mode === 'words' ? text.split(/\s+/) : text.split('');
    var real = [], i;
    for(i = 0; i < units.length; i++){ if(units[i].length) real.push(units[i]); }

    el.innerHTML = '';
    var visible = 0, total = 0;
    for(i = 0; i < real.length; i++){ if(real[i].trim().length) total++; }

    for(i = 0; i < real.length; i++){
      var unit = real[i];
      var blank = !unit.trim().length;
      var span = document.createElement('span');
      span.className = 'tx fx-' + fx;
      span.textContent = unit === ' ' ? '\u00A0' : unit;

      if(!blank){
        var order = rev ? (total - 1 - visible) : visible;
        span.style.animationDelay = (base + order * step) + 'ms';
        visible++;
      }else{
        span.style.animationDelay = base + 'ms';
      }

      if(fx === 'rise'){                     /* needs an overflow mask */
        var mask = document.createElement('span');
        mask.className = 'mask';
        mask.appendChild(span);
        el.appendChild(mask);
      }else if(fx === 'left' || fx === 'right'){
        span.className = 'tx fx-' + (i % 2 ? 'right' : 'left');
        el.appendChild(span);
      }else{
        el.appendChild(span);
      }
      if(mode === 'words' && i < real.length - 1) el.appendChild(document.createTextNode(' '));
    }

    if(el.classList.contains('gleam')){
      el._lit = setTimeout(function(){
        el.innerHTML = html;
        el.classList.add('lit');
      }, base + Math.max(0, total - 1) * step + 760);
    }

    if(el.classList.contains('flowy')){
      el._flow = setTimeout(function(){
        var spans = el.querySelectorAll('.tx');
        for(var n = 0; n < spans.length; n++){
          spans[n].className = 'tx floating';
          spans[n].style.animationDelay = (n * 260) + 'ms';
        }
      }, base + Math.max(0, total - 1) * step + 620);
    }
  }

  /* ---- fill content from CONFIG ---------------------------------------- */
  function pick(path){
    var parts = path.split('.'), v = CONFIG, i;
    for(i = 0; i < parts.length; i++){ v = v[parts[i]]; if(v === undefined) return ''; }
    return v;
  }

  var keyed = document.querySelectorAll('[data-k]');
  for(var i = 0; i < keyed.length; i++){
    keyed[i].textContent = pick(keyed[i].getAttribute('data-k'));
  }

  /* build the pieces */
  var holders = document.querySelectorAll('[data-piece]');
  for(i = 0; i < holders.length; i++){
    var key = holders[i].getAttribute('data-piece');
    holders[i].appendChild(buildPiece(CONFIG[key], key));
  }

  /* sizing: solo pieces vs the interlocked pair */
  var SOLO = 296, COMBO = 208;
  var solo = document.querySelectorAll('#s1 .piece, #s2 .piece');
  for(i = 0; i < solo.length; i++) solo[i].style.width = SOLO + 'px';

  var pcL = document.querySelector('#s3 .pc-left');
  var pcR = document.querySelector('#s3 .pc-right');
  pcL.style.width = COMBO + 'px';
  pcR.style.width = COMBO + 'px';
  /* pull the right piece in by exactly the two bleed margins so the tab
     seats inside the socket with no gap and no overlap */
  pcR.style.marginLeft = (-(2 * PAD) * COMBO / VB_W).toFixed(2) + 'px';

  /* ---- scene loop ------------------------------------------------------- */
  var ids  = ['s1', 's2', 's3', 's4'];
  var HOLD = CONFIG.timing.hold, GAP = CONFIG.timing.gap;
  var STEP = HOLD + GAP;
  var LOOP = ids.length * STEP;
  var timers = [];

  function restart(nodes){
    for(var j = 0; j < nodes.length; j++){
      nodes[j].style.animation = 'none';
      void nodes[j].offsetWidth;
      nodes[j].style.animation = '';
    }
  }

  function show(id){
    var scenes = document.querySelectorAll('.scene');
    for(var j = 0; j < scenes.length; j++) scenes[j].classList.remove('active');
    var el = document.getElementById(id);
    el.classList.add('active');
    restart(el.querySelectorAll('.piece, .tag, .chip-left, .chip-right, .divider'));
    var anims = el.querySelectorAll('[data-anim]');
    for(var k = 0; k < anims.length; k++) reveal(anims[k]);
  }

  function cycle(){
    for(var j = 0; j < timers.length; j++) clearTimeout(timers[j]);
    timers = [];
    ids.forEach(function(id, idx){
      timers.push(setTimeout(function(){ show(id); }, idx * STEP));
      timers.push(setTimeout(function(){
        document.getElementById(id).classList.remove('active');
      }, idx * STEP + HOLD));
    });
  }

  cycle();
  setInterval(cycle, LOOP);
})();
</script>

</body>
</html>
